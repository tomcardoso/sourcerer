<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sourcerer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #1a1a1a;
      color: #e8e8e8;
      width: 280px;
      padding: 16px;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 12px;
      color: #fff;
    }
    #status {
      font-size: 12px;
      color: #888;
      margin-bottom: 14px;
      min-height: 16px;
    }
    #status.ok { color: #6bcf7f; }
    #status.err { color: #f87272; }
    button {
      width: 100%;
      padding: 9px 14px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:disabled { opacity: 0.45; cursor: default; }
    #btn-capture {
      background: #4f8ef7;
      color: #fff;
    }
    #btn-capture:not(:disabled):hover { opacity: 0.85; }
    #btn-connect {
      background: #333;
      color: #e8e8e8;
      border: 1px solid #444;
    }
    #btn-connect:not(:disabled):hover { background: #3a3a3a; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <h1>Sourcerer</h1>
  <div id="status">Checking…</div>
  <button id="btn-capture" class="hidden" disabled>Capture screenshot</button>
  <button id="btn-connect" class="hidden">Connect to Sourcerer</button>
  <script src="popup.js"></script>
</body>
</html>
