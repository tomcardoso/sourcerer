name: Claude Code Review

on:
  pull_request:
    types: [labeled]

jobs:
  review:
    if: github.event.label.name == 'claude-review' && github.actor == 'tomcardoso'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude-review
          claude_args: '--allowed-tools "Bash(gh pr diff *),Bash(gh pr view *),Read" --max-turns 5'
          prompt: |
            Run `gh pr diff $PR_NUMBER` to get the diff for this pull request, then review only those changes. Focus on:
            - Bugs and edge cases introduced by the diff
            - Security issues
            - Code that violates patterns visible in the changed files
            Be concise. Only flag real issues. Post your findings as a PR review comment.
