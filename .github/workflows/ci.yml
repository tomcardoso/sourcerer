name: CI

on:
  pull_request:
    branches: [main]
    # A pull request that changes only the app screenshots has no code to test. This is the one
    # app-release.yml's `screenshots` job opens after each release: GitHub would create this run but
    # hold it for approval (the pull request's author is github-actions[bot]), and the held run
    # blocks the merge. The job starts CI by dispatch instead (below).
    paths-ignore: ['docs/images/app-*.png']
  # Started by app-release.yml's `screenshots` job on its pull request, so the `test` check main's
  # ruleset requires is reported on the branch's commit.
  workflow_dispatch:
  # Called by app-release.yml, so a release runs the same checks before it builds anything.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only a newer push to a pull request replaces its older run; a release's checks never cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules (including compiled native binaries)
        id: cache-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node20-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
