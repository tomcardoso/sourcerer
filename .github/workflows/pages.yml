name: Website

# Builds the website (site/, from the landing page and docs/) and publishes it to GitHub Pages:
# https://tomcardoso.github.io/sourcerer/
#
# It shows the app screenshots committed in docs/images/, which build.yml's `screenshots` job
# retakes after every release, so the site shows the app as released.
#
# It runs when docs/ or site/ change on main, after each release (build.yml's `screenshots` job
# starts it once the new screenshots are merged, since a release or merge made with a workflow's
# token triggers nothing), and by hand. On a pull request it only builds, so a broken page fails
# the check before it merges. A change to the app screenshots alone starts neither: the release
# that took them already rebuilds the site.

on:
  push:
    branches: [main]
    paths: ['docs/**', '!docs/images/app-*.png', 'site/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['docs/**', '!docs/images/app-*.png', 'site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Build the website
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci && npm run build

      - name: Upload the website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
