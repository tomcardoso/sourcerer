name: Platform tests

# The tests on Windows and macOS, after a merge to main that touches code or dependencies.
# Pull requests test on Linux only (ci.yml), to keep them quick; this catches a platform-only
# failure minutes after the merge that caused it, instead of at the next release (issue #461).
# A failure shows on main's commit, to fix in a follow-up pull request. A release still runs
# every platform's tests before it tags anything (build.yml). Run it by hand to test a branch.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - 'electron.vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/platforms.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # As in build.yml, which tests the same way on every platform before a release.
      - name: Rebuild native modules for Node
        run: npm run rebuild:node

      - name: Run tests
        run: npm test
