name: Build and Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Node
        run: npm run rebuild:node

      - name: Run tests
        run: npm test

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Build app (electron-vite)
        run: npm run build

      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          # Import the Developer ID G2 intermediate CA so the cert chain is valid
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            -o $RUNNER_TEMP/DeveloperIDG2CA.cer
          security import $RUNNER_TEMP/DeveloperIDG2CA.cer -k $KEYCHAIN_PATH
          echo "$APPLE_CERTIFICATE" | base64 --decode -o $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN_PATH \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s $KEYCHAIN_PATH \
            $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" $KEYCHAIN_PATH

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac -- --publish never

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: npm run dist:win -- --publish never

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: npm run dist:linux -- --publish never

      - name: Upload build artifacts (macOS)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.blockmap
            dist-electron/latest-mac.yml
          retention-days: 5
          if-no-files-found: error

      - name: Upload build artifacts (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/latest.yml
          retention-days: 5
          if-no-files-found: error

      - name: Upload build artifacts (Linux)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist-electron/*.AppImage
            dist-electron/*.blockmap
            dist-electron/latest-linux.yml
          retention-days: 5
          if-no-files-found: error

  finalize-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create release with assets and generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"

          # Ask GitHub to generate a changelog from merged PRs since the previous tag
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            --method POST \
            -f tag_name="$TAG" \
            --jq '.body' \
            | sed '/^## What'\''s Changed$/d' \
            > /tmp/generated-changelog.md

          # Sanitize: --jq '.body' writes the literal string "null" when the API
          # has no previous tag to diff against (e.g. the very first release).
          if [ "$(cat /tmp/generated-changelog.md)" = "null" ]; then
            : > /tmp/generated-changelog.md
          fi

          # Splice changelog into template, replacing placeholder and {version}
          VERSION="$VERSION" python3 .github/scripts/splice-release-notes.py

          # Collect all artifacts and create (or update) the release in one shot.
          # Using create+edit so the step is idempotent on workflow re-runs.
          assets=()
          while IFS= read -r asset; do
            assets+=("$asset")
          done < <(find artifacts/ -type f | sort)
          if gh release view "$TAG" &>/dev/null; then
            # Release already exists (e.g. re-run): update notes and re-upload assets.
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
            gh release upload --clobber "$TAG" "${assets[@]}"
          else
            gh release create "$TAG" \
              --notes-file /tmp/release-notes.md \
              "${assets[@]}"
          fi
