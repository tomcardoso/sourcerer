name: Build and Release

# Releases the desktop app. Two ways to start one:
#   - Push a tag v<version> on a commit whose package.json has that version.
#   - Run this workflow by hand on main (Actions → Build and Release → Run workflow) with
#     "release" ticked. It releases package.json's version and creates the tag v<version> only
#     once every build and test has passed. A cloud session can't push tags, so this is its way
#     to release; it also works from a phone.
# Run by hand without "release" ticked (on any branch), it is a test build: every platform is
# built and tested, the installers and screenshots are kept as the run's artifacts, and nothing
# is published.
# After a release, the `screenshots` job retakes the committed app screenshots and merges them
# into main through a pull request of its own.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: "Release package.json's version (run on main)"
        type: boolean
        default: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - id: v
        name: Work out what this run releases
        shell: bash
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"
            if [ "${TAG#v}" != "$PKG" ]; then
              echo "::error::package.json's version is $PKG; bump it to ${TAG#v} before tagging $TAG"
              exit 1
            fi
          elif [ "$RELEASE_INPUT" = true ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::A release runs on main; this run is on $GITHUB_REF_NAME"
              exit 1
            fi
            TAG="v$PKG"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "::error::$TAG already exists; bump package.json's version first (npm version patch)"
              exit 1
            fi
          else
            echo "A test build of $PKG: nothing will be published."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "release=true"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Node
        run: npm run rebuild:node

      - name: Run tests
        run: npm test

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Build app (electron-vite)
        run: npm run build

      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          # Import the Developer ID G2 intermediate CA so the cert chain is valid
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            -o $RUNNER_TEMP/DeveloperIDG2CA.cer
          security import $RUNNER_TEMP/DeveloperIDG2CA.cer -k $KEYCHAIN_PATH
          echo "$APPLE_CERTIFICATE" | base64 --decode -o $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN_PATH \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s $KEYCHAIN_PATH \
            $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" $KEYCHAIN_PATH

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac -- --publish never

      - name: Install Azure Artifact Signing module (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Install-Module -Name TrustedSigning -Force -AllowClobber -Scope CurrentUser

      - name: Package (Windows)
        if: runner.os == 'Windows'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
        run: npm run dist:win -- --publish never

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: npm run dist:linux -- --publish never

      - name: Upload build artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.zip.blockmap
            dist-electron/latest-mac.yml
          retention-days: 5
          if-no-files-found: error

      - name: Upload build artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/latest.yml
          retention-days: 5
          if-no-files-found: error

      - name: Upload build artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist-electron/*.AppImage
            dist-electron/*.blockmap
            dist-electron/latest-linux.yml
          retention-days: 5
          if-no-files-found: error

  finalize-release:
    needs: [version, build]
    runs-on: ubuntu-latest
    if: needs.version.outputs.release == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Tag the commit (a release started by hand)
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Made now, once every build and test has passed. A tag made with this job's token
          # starts no other workflow, so this run is the only release run. Fails if the tag
          # was created since the version job checked.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST \
            -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"

      - name: Create release with assets and generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |

          # Ask GitHub to generate a changelog from merged PRs since the previous tag
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            --method POST \
            -f tag_name="$TAG" \
            --jq '.body' \
            | sed '/^## What'\''s Changed$/d' \
            > /tmp/generated-changelog.md

          # Sanitize: --jq '.body' writes the literal string "null" when the API
          # has no previous tag to diff against (e.g. the very first release).
          if [ "$(cat /tmp/generated-changelog.md)" = "null" ]; then
            : > /tmp/generated-changelog.md
          fi

          # Prefer the human-written "What's new" section from the version bump PR
          # (branch: chore/v{VERSION}) over the raw generated PR list.
          PR_BODY=$(gh pr list \
            --state merged \
            --head "chore/v${VERSION}" \
            --json body \
            --jq '.[0].body // ""' 2>/dev/null || echo "")
          if [ -n "$PR_BODY" ]; then
            WHATS_NEW=$(echo "$PR_BODY" | python3 .github/scripts/extract-whats-new.py 2>/dev/null || echo "")
            if [ -n "$WHATS_NEW" ]; then
              echo "$WHATS_NEW" > /tmp/generated-changelog.md
            fi
          fi

          # Splice changelog into template, replacing placeholder and {version}
          VERSION="$VERSION" python3 .github/scripts/splice-release-notes.py

          # Collect all artifacts and create (or update) the release in one shot.
          # Using create+edit so the step is idempotent on workflow re-runs.
          assets=()
          while IFS= read -r asset; do
            assets+=("$asset")
          done < <(find artifacts/ -type f | sort)
          if gh release view "$TAG" &>/dev/null; then
            # Release already exists (e.g. re-run): update notes and re-upload assets.
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
            gh release upload --clobber "$TAG" "${assets[@]}"
          else
            gh release create "$TAG" \
              --notes-file /tmp/release-notes.md \
              "${assets[@]}"
          fi

  screenshots:
    # After a release, the committed app screenshots (docs/images/app-*.png, which the README and
    # the docs on GitHub show) are taken again and merged into main, so they never fall behind the
    # app. The website takes its own fresh copies on every deploy (pages.yml), so this is only for
    # the committed ones. It runs after the release is published, so a failed capture never holds
    # one up.
    #
    # main takes changes only through a pull request whose `test` check has passed. A pull request
    # opened with this job's token starts no workflow, so the job starts CI on the branch by
    # dispatch (which that token can do), waits for it, and then merges the pull request itself.
    # Needs Settings → Actions → General → "Allow GitHub Actions to create and approve pull
    # requests" (only the create part is used). If anything is refused, the pull request stays
    # open to merge by hand and the job fails, so the run shows it.
    #
    # A test build (run by hand without "release") takes the screenshots too and keeps them as the
    # run's artifact instead, so the job can be tried without publishing anything.
    needs: [version, finalize-release]
    if: >-
      !cancelled() && (
        needs.finalize-release.result == 'success' ||
        needs.version.outputs.release != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write       # push the screenshots branch, merge
      pull-requests: write  # open the pull request
      actions: write        # start CI on the branch and read its run
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run rebuild && npm run build

      - name: Take the screenshots
        run: xvfb-run -a npm run screenshots

      - name: Keep the screenshots (a test build)
        if: needs.version.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/images/app-*.png
          retention-days: 5
          if-no-files-found: error

      - name: Open a pull request with them
        id: pr
        if: needs.version.outputs.release == 'true'
        run: |
          if git diff --quiet -- docs/images && [ -z "$(git ls-files --others --exclude-standard docs/images)" ]; then
            echo "The screenshots are unchanged."
            exit 0
          fi
          # Taken from the released commit, offered on top of main as it is now.
          cp docs/images/app-*.png "$RUNNER_TEMP/"
          git checkout -- docs/images
          git clean -fdq -- docs/images
          git fetch --depth=1 origin main
          BRANCH="screenshots/$TAG"
          git switch -C "$BRANCH" FETCH_HEAD
          cp "$RUNNER_TEMP"/app-*.png docs/images/
          if git diff --quiet -- docs/images && [ -z "$(git ls-files --others --exclude-standard docs/images)" ]; then
            echo "main already has these screenshots."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          git commit -q -m "Docs: retake the app screenshots for $VERSION"
          git push --force origin "$BRANCH"
          PR=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -z "$PR" ]; then
            PR=$(gh pr create --base main --head "$BRANCH" \
              --title "Docs: app screenshots for $VERSION" \
              --body "The committed app screenshots, taken again after the $TAG release by Build and Release's \`screenshots\` job, which runs CI on this branch and merges this pull request itself. Only images change.")
          fi
          {
            echo "url=$PR"
            echo "branch=$BRANCH"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Run CI on it and merge it
        if: steps.pr.outputs.url != ''
        env:
          PR: ${{ steps.pr.outputs.url }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          gh workflow run ci.yml --ref "$BRANCH"
          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID=$(gh run list --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch \
              --json databaseId,headSha --jq "map(select(.headSha == \"$SHA\")) | .[0].databaseId // empty")
            [ -n "$RUN_ID" ] && break
            sleep 10
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::CI didn't start on $BRANCH; $PR is open to merge by hand."
            exit 1
          fi
          if ! gh run watch "$RUN_ID" --exit-status --interval 20; then
            echo "::error::CI failed on $BRANCH; $PR is open to look at."
            exit 1
          fi
          # GitHub can take a moment to count the finished check towards the pull request.
          for _ in $(seq 1 6); do
            if gh pr merge "$PR" --squash --delete-branch; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::Couldn't merge $PR; it's open to merge by hand."
          exit 1

  website:
    # Rebuild the website so its download buttons name the new release and its screenshots show the
    # new version. A release published with this workflow's token starts no other workflow, so
    # pages.yml is started here instead.
    needs: [version, finalize-release]
    runs-on: ubuntu-latest
    if: needs.version.outputs.release == 'true'
    permissions:
      actions: write
    steps:
      - name: Start the website build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
